# Základní ovladače
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_ADC=y

# USB Stack (Základ)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Blackpill Haptika"

# TOTO CHYBĚLO: Ovladač pro virtuální sériový port přes USB
CONFIG_USB_CDC_ACM=y

# Nastavení konzole
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y  # firmware ceka na DTR (screen ho nastavi) pred spustenim haptic_init

# CMSIS DSP for ARM math library
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FASTMATH=y

# Printk support
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# FPU Support - Hardware Floating Point Unit
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# Enable logging
CONFIG_LOG=y

# System tick rate must be >= FOC loop frequency (10 kHz)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Main thread stack — haptic_init + FOC cal potrebuji hodne zasobniku
CONFIG_MAIN_STACK_SIZE=8192

# Fault diagnostika — vypise registry pri hard faultu
CONFIG_FAULT_DUMP=2
